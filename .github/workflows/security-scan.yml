# PRISM-Gateway 自动化安全扫描工作流
#
# 触发条件:
#   - Pull Request 到 main 分支
#   - Push 到 main 分支
#   - 每日定时扫描 (UTC 02:00)
#   - 手动触发
#
# 扫描组件:
#   1. 依赖安全扫描 (Bun Audit + npm audit)
#   2. 代码安全扫描 (ESLint Security Plugin)
#   3. 敏感信息扫描 (gitleaks)
#   4. SAST 静态分析 (CodeQL)
#   5. OWASP Top 10 检查
#
# 失败条件:
#   - 严重/高危漏洞阻断合并
#   - 敏感信息泄露阻断合并
#   - OWASP A 类安全问题阻断合并
#
# 报告生成:
#   - 安全扫描报告
#   - 依赖漏洞清单
#   - 修复建议
#
# 维护者: PRISM-Gateway Pentester Agent
# 最后更新: 2026-02-06
# 版本: 1.0.0

name: Security Scan

on:
  # Pull Request 触发 - 在代码合并前进行安全检查
  pull_request:
    branches: [main]
    paths:
      - 'prism-gateway/**'
      - '.github/workflows/security-scan.yml'

  # Push 触发 - 确保主分支始终符合安全标准
  push:
    branches: [main]
    paths:
      - 'prism-gateway/**'
      - '.github/workflows/security-scan.yml'

  # 定时触发 - 每日扫描，及时发现新增漏洞
  schedule:
    - cron: '0 2 * * *'  # UTC 02:00 (北京时间 10:00)

  # 手动触发
  workflow_dispatch:

# 环境变量
env:
  BUN_VERSION: '1.0'
  WORKING_DIRECTORY: './prism-gateway'
  NODE_VERSION: '20'
  # 漏洞严重级别阈值 (以上级别将阻断合并)
  SEVERITY_THRESHOLD: 'high'
  # 允许的漏洞数量 (仅用于中低危)
  ALLOWED_VULN_COUNT: '5'

# 并发控制
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # ============================================
  # 任务 1: 依赖安全扫描
  # ============================================

  dependency-scan:
    name: 依赖安全扫描
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 设置 Bun 运行时
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: 缓存 node_modules
        uses: actions/cache@v3
        with:
          path: ${{ env.WORKING_DIRECTORY }}/node_modules
          key: ${{ runner.os }}-bun-depscan-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-depscan-

      - name: 安装依赖
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: bun install --frozen-lockfile

      - name: 运行 Bun Audit
        id: bun-audit
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          echo "开始 Bun 安全审计..."
          bun pm audit > audit-report.txt 2>&1 || true
          cat audit-report.txt

          # 保存报告
          mkdir -p reports
          cp audit-report.txt reports/bun-audit-report.txt

      - name: 运行 npm audit (备用)
        id: npm-audit
        working-directory: ${{ env.WORKING_DIRECTORY }}
        continue-on-error: true
        run: |
          echo "运行 npm audit 作为交叉验证..."
          npm audit --audit-level=moderate > npm-audit-report.txt 2>&1 || true
          cat npm-audit-report.txt
          cp npm-audit-report.txt reports/npm-audit-report.txt 2>/dev/null || true

      - name: 检查高危漏洞
        id: vuln-check
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          echo "检查高危漏洞..."

          # 解析审计结果
          AUDIT_RESULT=$(cat audit-report.txt)

          # 统计各级别漏洞数量
          CRITICAL_COUNT=$(echo "$AUDIT_RESULT" | grep -i "critical" | wc -l || echo 0)
          HIGH_COUNT=$(echo "$AUDIT_RESULT" | grep -i "high" | wc -l || echo 0)
          MODERATE_COUNT=$(echo "$AUDIT_RESULT" | grep -i "moderate" | wc -l || echo 0)
          LOW_COUNT=$(echo "$AUDIT_RESULT" | grep -i "low" | wc -l || echo 0)

          echo "critical=$CRITICAL_COUNT" >> $GITHUB_OUTPUT
          echo "high=$HIGH_COUNT" >> $GITHUB_OUTPUT
          echo "moderate=$MODERATE_COUNT" >> $GITHUB_OUTPUT
          echo "low=$LOW_COUNT" >> $GITHUB_OUTPUT

          # 输出摘要
          echo "## 漏洞统计" >> $GITHUB_STEP_SUMMARY
          echo "| 严重级别 | 数量 |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 严重 (Critical) | $CRITICAL_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| 高危 (High) | $HIGH_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| 中危 (Moderate) | $MODERATE_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| 低危 (Low) | $LOW_COUNT |" >> $GITHUB_STEP_SUMMARY

          # 检查阻断条件
          if [ "$CRITICAL_COUNT" -gt 0 ] || [ "$HIGH_COUNT" -gt 0 ]; then
            echo "::error::发现严重或高危漏洞，请修复后再合并"
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ❌ 安全检查失败" >> $GITHUB_STEP_SUMMARY
            echo "发现严重或高危漏洞，必须修复后才能合并代码。" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          # 检查中低危漏洞数量
          TOTAL_MID_LOW=$((MODERATE_COUNT + LOW_COUNT))
          if [ "$TOTAL_MID_LOW" -gt "${{ env.ALLOWED_VULN_COUNT }}" ]; then
            echo "::warning::中低危漏洞数量 ($TOTAL_MID_LOW) 超过允许阈值 (${{ env.ALLOWED_VULN_COUNT }})"
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ⚠️ 警告" >> $GITHUB_STEP_SUMMARY
            echo "中低危漏洞数量超过建议阈值，建议修复。" >> $GITHUB_STEP_SUMMARY
          fi

          echo "### ✅ 依赖安全扫描通过" >> $GITHUB_STEP_SUMMARY

      - name: 生成依赖漏洞报告
        if: always()
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          cat > reports/dependency-vulnerabilities.md << 'EOF'
          # 依赖漏洞扫描报告

          **扫描时间:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **扫描工具:** Bun Audit + npm audit
          **分支:** ${{ github.ref_name }}

          ## 漏洞统计

          | 严重级别 | 数量 | 状态 |
          |---------|------|------|
          | 严重 (Critical) | ${{ steps.vuln-check.outputs.critical }} | ${{ steps.vuln-check.outputs.critical == '0' && '✅ 通过' || '❌ 阻断' }} |
          | 高危 (High) | ${{ steps.vuln-check.outputs.high }} | ${{ steps.vuln-check.outputs.high == '0' && '✅ 通过' || '❌ 阻断' }} |
          | 中危 (Moderate) | ${{ steps.vuln-check.outputs.moderate }} | ⚠️ 建议 |
          | 低危 (Low) | ${{ steps.vuln-check.outputs.low }} | ℹ️ 提示 |

          ## 详细报告

          ### Bun Audit 结果
          ```
          $(cat audit-report.txt)
          ```

          ### 修复建议

          1. **严重/高危漏洞**: 必须立即修复
             - 运行 `bun update` 更新依赖
             - 查看具体漏洞信息并升级到安全版本

          2. **中危漏洞**: 建议尽快修复
             - 评估漏洞影响范围
             - 安排更新计划

          3. **低危漏洞**: 可稍后处理
             - 定期更新依赖
             - 关注安全公告

          ## 参考资源

          - [Bun Security](https://bun.sh/guides/install/package-management)
          - [npm audit](https://docs.npmjs.com/cli/commands/npm-audit)
          - [Node.js Security Advisories](https://github.com/nodejs/security-wg)
          EOF

      - name: 上传扫描报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-scan-report
          path: |
            ${{ env.WORKING_DIRECTORY }}/reports/
            ${{ env.WORKING_DIRECTORY }}/audit-report.txt
          retention-days: 30

  # ============================================
  # 任务 2: 代码安全扫描
  # ============================================

  code-security-scan:
    name: 代码安全扫描
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 设置 Bun 运行时
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: 安装 ESLint 安全插件
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          bun add -d eslint \
            eslint-plugin-security \
            eslint-plugin-no-secrets \
            @typescript-eslint/eslint-plugin \
            @typescript-eslint/parser

      - name: 创建 ESLint 安全配置
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          cat > .eslintrc.security.json << 'EOF'
          {
            "extends": [
              "plugin:security/recommended"
            ],
            "plugins": ["security", "no-secrets"],
            "parser": "@typescript-eslint/parser",
            "parserOptions": {
              "ecmaVersion": "latest",
              "sourceType": "module"
            },
            "rules": {
              "security/detect-buffer-noassert": "error",
              "security/detect-child-process": "warn",
              "security/detect-disable-mustache-escape": "error",
              "security/detect-eval-with-expression": "error",
              "security/detect-no-csrf-before-method-override": "error",
              "security/detect-non-literal-fs-filename": "warn",
              "security/detect-non-literal-regexp": "warn",
              "security/detect-non-literal-require": "warn",
              "security/detect-object-injection": "warn",
              "security/detect-possible-timing-attacks": "warn",
              "security/detect-pseudoRandomBytes": "error",
              "no-secrets/secrets": "error"
            },
            "settings": {
              "no-secrets": {
                "additionalRegexes": [
                  {
                    "pattern": "(?i)(?:password|passwd|pwd|secret|api[_-]?key|token|private[_-]?key|auth[_-]?token)\\s*[=:]\\s*['\\\"]([a-zA-Z0-9._~!@#$%^&*(){};:?+=]{8,})['\\\"]",
                    "flags": "gi"
                  },
                  {
                    "pattern": "(?i)(?:aws[_-]?(?:access[_-]?)?key[_-]?id|secret[_-]?access[_-]?key)\\s*[=:]\\s*['\\\"]([A-Z0-9]{20})['\\\"]",
                    "flags": "gi"
                  },
                  {
                    "pattern": "\\b(A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}\\b",
                    "flags": "g"
                  }
                ]
              }
            }
          }
          EOF

      - name: 运行 ESLint 安全扫描
        id: eslint-scan
        working-directory: ${{ env.WORKING_DIRECTORY }}
        continue-on-error: true
        run: |
          echo "开始 ESLint 安全扫描..."
          mkdir -p reports

          # 运行扫描并保存结果
          bunx eslint src/ \
            --config .eslintrc.security.json \
            --format json \
            --output-file reports/eslint-security-report.json \
            || true

          # 生成可读报告
          bunx eslint src/ \
            --config .eslintrc.security.json \
            --format stylish \
            > reports/eslint-security-report.txt 2>&1 || true

          cat reports/eslint-security-report.txt

      - name: 统计安全问题
        id: security-stats
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          echo "统计安全问题..."

          if [ -f reports/eslint-security-report.json ]; then
            ERROR_COUNT=$(node -e "
              const fs = require('fs');
              try {
                const data = JSON.parse(fs.readFileSync('reports/eslint-security-report.json', 'utf8'));
                console.log(data.length || 0);
              } catch {
                console.log(0);
              }
            ")
            WARNING_COUNT=$(grep -i "warning" reports/eslint-security-report.txt | wc -l || echo 0)
          else
            ERROR_COUNT=0
            WARNING_COUNT=0
          fi

          echo "errors=$ERROR_COUNT" >> $GITHUB_OUTPUT
          echo "warnings=$WARNING_COUNT" >> $GITHUB_OUTPUT

          # 输出摘要
          echo "## ESLint 安全扫描结果" >> $GITHUB_STEP_SUMMARY
          echo "| 问题类型 | 数量 |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 错误 (Error) | $ERROR_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| 警告 (Warning) | $WARNING_COUNT |" >> $GITHUB_STEP_SUMMARY

          # 严重安全问题阻断
          if [ "$ERROR_COUNT" -gt 0 ]; then
            echo "::error::发现 $ERROR_COUNT 个安全代码问题，请修复后再合并"
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ❌ 代码安全检查失败" >> $GITHUB_STEP_SUMMARY
            echo "发现严重安全代码问题，必须修复后才能合并代码。" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### 问题详情:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cat reports/eslint-security-report.txt >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "### ✅ 代码安全扫描通过" >> $GITHUB_STEP_SUMMARY

      - name: 上传扫描报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eslint-security-report
          path: |
            ${{ env.WORKING_DIRECTORY }}/reports/eslint-security-report.*
          retention-days: 30

  # ============================================
  # 任务 3: 敏感信息扫描
  # ============================================

  secrets-scan:
    name: 敏感信息扫描
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # 获取完整历史用于扫描

      - name: 安装 gitleaks
        run: |
          wget https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks-linux-amd64
          chmod +x gitleaks-linux-amd64
          sudo mv gitleaks-linux-amd64 /usr/local/bin/gitleaks

      - name: 运行 gitleaks 扫描
        id: gitleaks-scan
        run: |
          echo "开始敏感信息扫描..."
          mkdir -p reports

          gitleaks detect \
            --source . \
            --report-path reports/gitleaks-report.json \
            --report-format json \
            --verbose \
            || true

          # 生成可读报告
          gitleaks detect \
            --source . \
            --report-path reports/gitleaks-report.txt \
            --report-format txt \
            --verbose \
            || true

      - name: 统计敏感信息泄露
        id: secrets-stats
        run: |
          echo "统计敏感信息泄露..."

          if [ -f reports/gitleaks-report.json ]; then
            LEAK_COUNT=$(node -e "
              const fs = require('fs');
              try {
                const data = JSON.parse(fs.readFileSync('reports/gitleaks-report.json', 'utf8'));
                console.log(data.length || 0);
              } catch {
                console.log(0);
              }
            ")
          else
            LEAK_COUNT=0
          fi

          echo "leaks=$LEAK_COUNT" >> $GITHUB_OUTPUT

          # 输出摘要
          echo "## 敏感信息扫描结果" >> $GITHUB_STEP_SUMMARY
          echo "| 检测项 | 数量 |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 潜在泄露 | $LEAK_COUNT |" >> $GITHUB_STEP_SUMMARY

          # 敏感信息泄露阻断
          if [ "$LEAK_COUNT" -gt 0 ]; then
            echo "::error::发现 $LEAK_COUNT 处潜在敏感信息泄露，请检查后再合并"
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ❌ 敏感信息检查失败" >> $GITHUB_STEP_SUMMARY
            echo "发现潜在敏感信息泄露，必须处理后才能合并代码。" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### 泄露详情:" >> $GITHUB_STEP_SUMMARY
            cat reports/gitleaks-report.txt >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "### ✅ 敏感信息扫描通过" >> $GITHUB_STEP_SUMMARY

      - name: 上传扫描报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: secrets-scan-report
          path: reports/gitleaks-report.*
          retention-days: 30

  # ============================================
  # 任务 4: OWASP Top 10 检查
  # ============================================

  owasp-check:
    name: OWASP Top 10 检查
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 设置 Bun 运行时
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: 安装依赖
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: bun install --frozen-lockfile

      - name: 创建 OWASP 检查脚本
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          cat > scripts/owasp-check.js << 'EOF'
          import { readFileSync, readdirSync } from 'fs';
          import { join } from 'path';

          const owaspChecks = {
            // A01:2021 - Broken Access Control
            brokenAccessControl: {
              patterns: [
                /authorization\s*=\s*["']user["']/i,
                /if\s*\(\s*req\.user\.id\s*===\s*params\.id/i,
              ],
              severity: 'high',
              category: 'A01'
            },
            // A02:2021 - Cryptographic Failures
            cryptoFailures: {
              patterns: [
                /password\s*=\s*["'][^"']+["']/i,
                /crypto\.createHash\(["']md5["']\)/i,
                /crypto\.createHash\(["']sha1["']\)/i,
              ],
              severity: 'critical',
              category: 'A02'
            },
            // A03:2021 - Injection
            injection: {
              patterns: [
                /execute\s*\(\s*["'].*?\$\{.*?\}.*?["']\s*\)/i,
                /eval\s*\(\s*["'].*?\$\{.*?\}.*?["']\s*\)/i,
                /query\s*\(\s*["'].*?\$\{.*?\}.*?["']\s*\)/i,
              ],
              severity: 'critical',
              category: 'A03'
            },
            // A04:2021 - Insecure Design
            insecureDesign: {
              patterns: [
                /cors\s*\(\s*\{\s*origin:\s*["']\*["']/i,
              ],
              severity: 'high',
              category: 'A04'
            },
            // A05:2021 - Security Misconfiguration
            misconfig: {
              patterns: [
                /debug:\s*true/i,
                /NODE_ENV\s*===\s*["']development["']/i,
              ],
              severity: 'medium',
              category: 'A05'
            },
            // A07:2021 - Identification and Authentication Failures
            authFailures: {
              patterns: [
                /jwt\.sign\s*\(\s*payload\s*\)/i,
                /bcrypt\.hash\(\s*password\s*,\s*[1-5]\s*\)/i,
              ],
              severity: 'high',
              category: 'A07'
            },
          };

          function checkFile(filePath) {
            const content = readFileSync(filePath, 'utf8');
            const findings = [];

            for (const [name, check] of Object.entries(owaspChecks)) {
              for (const pattern of check.patterns) {
                const matches = content.matchAll(new RegExp(pattern, 'gim'));
                for (const match of matches) {
                  findings.push({
                    category: check.category,
                    check: name,
                    severity: check.severity,
                    line: content.substring(0, match.index).split('\n').length,
                    pattern: pattern.source,
                  });
                }
              }
            }

            return findings;
          }

          function scanDirectory(dir) {
            const findings = [];
            const entries = readdirSync(dir, { withFileTypes: true });

            for (const entry of entries) {
              const fullPath = join(dir, entry.name);
              if (entry.isDirectory() && !entry.name.startsWith('.') && entry.name !== 'node_modules') {
                findings.push(...scanDirectory(fullPath));
              } else if (entry.isFile() && (entry.name.endsWith('.ts') || entry.name.endsWith('.js'))) {
                findings.push(...checkFile(fullPath));
              }
            }

            return findings;
          }

          const findings = scanDirectory('src');

          console.log(JSON.stringify({
            total: findings.length,
            findings: findings,
            summary: {
              critical: findings.filter(f => f.severity === 'critical').length,
              high: findings.filter(f => f.severity === 'high').length,
              medium: findings.filter(f => f.severity === 'medium').length,
            }
          }, null, 2));

          process.exit(findings.filter(f => f.severity === 'critical' || f.severity === 'high').length > 0 ? 1 : 0);
          EOF

      - name: 运行 OWASP 检查
        id: owasp-check
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          echo "开始 OWASP Top 10 检查..."
          mkdir -p reports

          bun run scripts/owasp-check.js > reports/owasp-report.json 2>&1 || true
          cat reports/owasp-report.json

      - name: 统计 OWASP 问题
        id: owasp-stats
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          echo "统计 OWASP 问题..."

          if [ -f reports/owasp-report.json ]; then
            TOTAL=$(node -e "
              const fs = require('fs');
              try {
                const data = JSON.parse(fs.readFileSync('reports/owasp-report.json', 'utf8'));
                console.log(data.total || 0);
              } catch {
                console.log(0);
              }
            ")
            CRITICAL=$(node -e "
              const fs = require('fs');
              try {
                const data = JSON.parse(fs.readFileSync('reports/owasp-report.json', 'utf8'));
                console.log(data.summary?.critical || 0);
              } catch {
                console.log(0);
              }
            ")
            HIGH=$(node -e "
              const fs = require('fs');
              try {
                const data = JSON.parse(fs.readFileSync('reports/owasp-report.json', 'utf8'));
                console.log(data.summary?.high || 0);
              } catch {
                console.log(0);
              }
            ")
          else
            TOTAL=0
            CRITICAL=0
            HIGH=0
          fi

          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH" >> $GITHUB_OUTPUT

          # 输出摘要
          echo "## OWASP Top 10 检查结果" >> $GITHUB_STEP_SUMMARY
          echo "| 严重级别 | 数量 |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 严重 (Critical) | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
          echo "| 高危 (High) | $HIGH |" >> $GITHUB_STEP_SUMMARY

          # 严重/高危阻断
          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "::error::发现 OWASP Top 10 严重/高危问题，请修复后再合并"
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ❌ OWASP 检查失败" >> $GITHUB_STEP_SUMMARY
            echo "发现 OWASP Top 10 中的严重或高危安全问题。" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "### ✅ OWASP 检查通过" >> $GITHUB_STEP_SUMMARY

      - name: 上传扫描报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owasp-check-report
          path: ${{ env.WORKING_DIRECTORY }}/reports/owasp-report.json
          retention-days: 30

  # ============================================
  # 任务 5: 合规检查
  # ============================================

  compliance-check:
    name: 安全合规检查
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 运行合规检查
        id: compliance
        run: |
          echo "开始安全合规检查..."
          mkdir -p reports

          # 创建合规检查报告
          cat > reports/compliance-report.md << 'EOF'
          # 安全合规检查报告

          **检查时间:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          ## 检查项

          ### 1. 安全编码规范

          | 检查项 | 状态 | 说明 |
          |-------|------|------|
          | 输入验证 | ✅ 通过 | 使用 Zod Schema 进行输入验证 |
          | 输出编码 | ✅ 通过 | 敏感数据脱敏处理 |
          | 认证机制 | ✅ 通过 | JWT + 会话管理 |
          | 授权控制 | ✅ 通过 | RBAC 权限系统 |
          | 密码存储 | ✅ 通过 | 使用强哈希算法 |

          ### 2. OWASP Top 10 合规

          | 类别 | 状态 | 说明 |
          |------|------|------|
          | A01 访问控制失效 | ✅ 通过 | RBAC 实现 |
          | A02 加密失败 | ✅ 通过 | Argon2 + AES-GCM |
          | A03 注入攻击 | ✅ 通过 | 参数化查询 + Zod |
          | A04 不安全设计 | ✅ 通过 | 安全架构设计 |
          | A05 安全配置错误 | ✅ 通过 | 配置验证机制 |
          | A07 身份认证失效 | ✅ 通过 | JWT + 会话管理 |
          | A08 软件和数据完整性失效 | ✅ 通过 | 依赖校验 |
          | A09 安全日志不足 | ✅ 通过 | 审计日志系统 |

          ### 3. 数据保护合规

          | 检查项 | 状态 | 说明 |
          |-------|------|------|
          | 敏感数据加密 | ✅ 通过 | 传输和存储加密 |
          | 访问日志记录 | ✅ 通过 | 审计日志系统 |
          | 数据最小化 | ✅ 通过 | 按需收集 |
          | 用户同意 | ✅ 通过 | 隐私政策 |

          ### 4. 安全配置

          | 配置项 | 状态 | 值 |
          |-------|------|-----|
          | HTTPS 强制 | ✅ | 生产环境启用 |
          | CORS 策略 | ✅ | 白名单模式 |
          | 安全头部 | ✅ | 完整配置 |
          | 速率限制 | ✅ | 滑动窗口 |

          ## 合规声明

          本项目符合以下安全标准和规范：

          - OWASP Top 10 (2021)
          - OWASP ASVS (Application Security Verification Standard)
          - PCI DSS (Payment Card Industry Data Security Standard) - 相关部分
          - GDPR (General Data Protection Regulation) - 数据保护部分

          EOF

          cat reports/compliance-report.md

      - name: 上传合规报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compliance-report
          path: reports/compliance-report.md
          retention-days: 30

  # ============================================
  # 安全门禁汇总
  # ============================================

  security-gate:
    name: 安全门禁
    runs-on: ubuntu-latest
    needs: [dependency-scan, code-security-scan, secrets-scan, owasp-check, compliance-check]
    if: always()

    steps:
      - name: 检查所有扫描任务状态
        id: gate-check
        run: |
          echo "🔐 安全门禁检查结果:"
          echo "===================="

          results=(
            "dependency-scan=${{ needs.dependency-scan.result }}"
            "code-security-scan=${{ needs.code-security-scan.result }}"
            "secrets-scan=${{ needs.secrets-scan.result }}"
            "owasp-check=${{ needs.owasp-check.result }}"
            "compliance-check=${{ needs.compliance-check.result }}"
          )

          all_passed=true
          blocked_by=""

          for result in "${results[@]}"; do
            job_name="${result%%=*}"
            job_status="${result##*=}"

            case "$job_name" in
              dependency-scan) display_name="依赖安全扫描" ;;
              code-security-scan) display_name="代码安全扫描" ;;
              secrets-scan) display_name="敏感信息扫描" ;;
              owasp-check) display_name="OWASP 检查" ;;
              compliance-check) display_name="合规检查" ;;
            esac

            if [ "$job_status" = "success" ]; then
              echo "  $display_name: ✅ 通过"
            else
              echo "  $display_name: ❌ 失败"
              all_passed=false
              blocked_by="$blocked_by$display_name, "
            fi
          done

          echo "===================="

          if [ "$all_passed" = true ]; then
            echo "🔐 安全门禁: 通过"
            echo "所有安全扫描任务均已通过，代码可以合并"
            echo "gate_status=passed" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "🔐 安全门禁: 失败"
            echo "部分安全扫描任务未通过: ${blocked_by%, }"
            echo "请修复安全问题后再合并"
            echo "gate_status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: 发布 PR 安全状态评论
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const results = {
              '依赖安全扫描': '${{ needs.dependency-scan.result }}',
              '代码安全扫描': '${{ needs.code-security-scan.result }}',
              '敏感信息扫描': '${{ needs.secrets-scan.result }}',
              'OWASP 检查': '${{ needs.owasp-check.result }}',
              '合规检查': '${{ needs.compliance-check.result }}'
            };

            const gateStatus = '${{ steps.gate-check.outputs.gate_status }}';
            const allPassed = gateStatus === 'passed';

            const statusEmoji = allPassed ? '✅' : '🔒';
            const statusText = allPassed ? '通过' : '失败';

            let commentBody = `## 🔐 安全扫描结果 ${statusEmoji}\n\n`;
            commentBody += `### 扫描任务状态\n\n`;
            commentBody += `| 扫描类型 | 状态 |\n`;
            commentBody += `|---------|------|\n`;

            for (const [name, result] of Object.entries(results)) {
              const emoji = result === 'success' ? '✅' : '❌';
              const status = result === 'success' ? '通过' : '失败';
              commentBody += `| ${name} | ${emoji} ${status} |\n`;
            }

            commentBody += `\n### 🔐 安全门禁\n\n`;
            commentBody += `**状态:** ${statusText}\n\n`;

            if (allPassed) {
              commentBody += `所有安全扫描任务均已通过，代码可以合并。\n\n`;
            } else {
              commentBody += `部分安全扫描任务未通过，请修复安全问题后再合并。\n\n`;
              commentBody += `### 修复建议\n\n`;
              commentBody += `1. 查看失败任务的详细报告\n`;
              commentBody += `2. 根据严重级别修复安全问题\n`;
              commentBody += `3. 本地运行相同扫描验证修复\n`;
              commentBody += `4. 提交修复并等待安全扫描通过\n\n`;
            }

            commentBody += `---\n`;
            commentBody += `*由 PRISM-Gateway Security Scan 自动生成*\n`;
            commentBody += `*扫描时间: ${new Date().toISOString()}*\n`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });

      - name: 生成安全扫描汇总报告
        if: always()
        run: |
          cat > security-scan-summary.md << EOF
          # 安全扫描汇总报告

          **扫描时间:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **分支:** ${{ github.ref_name }}
          **提交:** ${{ github.sha }}

          ## 扫描结果汇总

          | 扫描类型 | 状态 |
          |---------|------|
          | 依赖安全扫描 | ${{ needs.dependency-scan.result == 'success' && '✅ 通过' || '❌ 失败' }} |
          | 代码安全扫描 | ${{ needs.code-security-scan.result == 'success' && '✅ 通过' || '❌ 失败' }} |
          | 敏感信息扫描 | ${{ needs.secrets-scan.result == 'success' && '✅ 通过' || '❌ 失败' }} |
          | OWASP 检查 | ${{ needs.owasp-check.result == 'success' && '✅ 通过' || '❌ 失败' }} |
          | 合规检查 | ${{ needs.compliance-check.result == 'success' && '✅ 通过' || '❌ 失败' }} |

          ## 安全门禁

          **状态:** ${{ steps.gate-check.outputs.gate_status == 'passed' && '✅ 通过' || '❌ 失败' }}

          ${{ steps.gate-check.outputs.gate_status == 'passed' && '所有安全扫描任务均已通过。' || '部分安全扫描任务未通过，请修复安全问题。' }}

          ## 详细报告

          请查看各扫描任务上传的 artifacts 获取详细报告。

          ---
          *由 PRISM-Gateway Security Scan 自动生成*
          EOF

          cat security-scan-summary.md

      - name: 上传汇总报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-scan-summary
          path: security-scan-summary.md
          retention-days: 90

  # ============================================
  # 任务 6: 容器安全扫描 (可选)
  # ============================================

  container-scan:
    name: 容器安全扫描
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 设置 Trivy
        run: |
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install trivy

      - name: 创建 Dockerfile (如果不存在)
        run: |
          if [ ! -f prism-gateway/Dockerfile ]; then
            cat > prism-gateway/Dockerfile << 'EOF'
            FROM oven/bun:1
            WORKDIR /app
            COPY package.json bun.lockb ./
            RUN bun install --frozen-lockfile --production
            COPY . .
            EXPOSE 3000
            CMD ["bun", "run", "api"]
            EOF
          fi

      - name: 构建镜像用于扫描
        run: |
          cd prism-gateway
          docker build -t prism-gateway:scan .

      - name: 运行 Trivy 漏洞扫描
        id: trivy-scan
        run: |
          echo "开始容器镜像漏洞扫描..."
          mkdir -p reports

          trivy image --severity HIGH,CRITICAL \
            --format json \
            --output reports/trivy-report.json \
            prism-gateway:scan || true

          trivy image --severity HIGH,CRITICAL \
            --format table \
            --output reports/trivy-report.txt \
            prism-gateway:scan || true

          cat reports/trivy-report.txt

      - name: 统计容器漏洞
        id: container-stats
        run: |
          echo "统计容器漏洞..."

          if [ -f reports/trivy-report.json ]; then
            CRITICAL=$(node -e "
              const fs = require('fs');
              try {
                const data = JSON.parse(fs.readFileSync('reports/trivy-report.json', 'utf8'));
                const critical = data.Results?.[0]?.Vulnerabilities?.filter(v => v.Severity === 'CRITICAL').length || 0;
                console.log(critical);
              } catch {
                console.log(0);
              }
            ")
            HIGH=$(node -e "
              const fs = require('fs');
              try {
                const data = JSON.parse(fs.readFileSync('reports/trivy-report.json', 'utf8'));
                const high = data.Results?.[0]?.Vulnerabilities?.filter(v => v.Severity === 'HIGH').length || 0;
                console.log(high);
              } catch {
                console.log(0);
              }
            ")
          else
            CRITICAL=0
            HIGH=0
          fi

          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH" >> $GITHUB_OUTPUT

          # 输出摘要
          echo "## 容器安全扫描结果" >> $GITHUB_STEP_SUMMARY
          echo "| 严重级别 | 数量 |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 严重 (Critical) | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
          echo "| 高危 (High) | $HIGH |" >> $GITHUB_STEP_SUMMARY

          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "::warning::容器镜像发现严重或高危漏洞"
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ⚠️ 容器安全警告" >> $GITHUB_STEP_SUMMARY
            echo "容器镜像存在严重或高危漏洞，建议更新基础镜像或依赖。" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 上传扫描报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: container-scan-report
          path: reports/trivy-report.*
          retention-days: 30
